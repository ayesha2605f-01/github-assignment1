<!DOCTYPE html>
<html>
<head>
    <title>Water Bottle Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Water Bottle Shop</a>
            <div>
                <a class="text-white me-3" href="#home">Home</a>
                <a class="text-white" href="#bottles">Bottles</a>
            </div>
        </div>
    </nav>
 <div id="home" class="hero text-center">
        <h1 id="title">Welcome to Water Bottle Shop</h1>
        <p>Buy good water bottles for school and office.</p>
        <button id="btn" class="btn btn-light">Click Me</button>
    </div>
    <div id="bottles" class="container my-5">
        <div class="row">

            <div class="col-md-4 mb-3">
                <div class="card p-3">
                    <h4>Steel Bottle</h4>
                    <p>Keeps water cold.</p>
                    <button class="show-btn btn btn-primary btn-sm">Show Price</button>
                    <p class="price">Price: Rs. 1500</p>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card p-3">
                    <h4>Glass Bottle</h4>
                    <p>Easy to clean.</p>
                    <button class="show-btn btn btn-primary btn-sm">Show Price</button>
                    <p class="price">Price: Rs. 900</p>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card p-3">
                    <h4>Sports Bottle</h4>
                    <p>Light and easy to carry.</p>
                    <button class="show-btn btn btn-primary btn-sm">Show Price</button>
                    <p class="price">Price: Rs. 600</p>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-success text-white text-center p-3">
        <p class="mb-0">Water Bottle Shop 2026</p>
    </footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
